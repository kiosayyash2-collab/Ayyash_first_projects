<!DOCTYPE html>
<html>
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    //main titlte
 <h1 class="title-font">JavaScript,html input Operators</h1>
 <h2></h2>

 //box to input username
 <h3 id="myh1">write you username in this box.</h3>
 <label>username</label>
 <input id="demo" class="input-box">
 <button id="mysubmit" class="sub-button">submit</button>
 <br>

 //box to input username
 <h3 id="myh1">write you age in this box.</h3>
 <label>age</label>
 <input id="demo_age" class="input-box_age">
 <button id="mysubmit_age" class="sub-button_age">submit</button>
 <br>

 <p id="myh2" class="title-font">this is feedback</p>
</body>
<style>
    .sub-button{
       color: rgb(30, 128, 0);
       stroke: rgb(126, 128, 0);
       stroke-width: 30px; 
   }
   
   .input-box{
       margin-right: 12px;
   }

   .title-font{
       font-family: "Arial", sans-serif;
   }

</style>
<script>
let username;
//username function
document.getElementById("mysubmit").onclick = function(){
    username = document.getElementById("demo").value;
    if(username == 'ayyash'){
     document.getElementById("myh1").textContent = `hello ${username} ,wellcome back mr.admin!`;
     document.getElementById("myh2").textContent = `hello ${username} welcome to our website!, is so simple and dont have any style, just html and js`;

    }else{
      document.getElementById("myh1").textContent = `hello ${username}`;
    document.getElementById("myh2").textContent = `hello ${username} welcome to my page!, is so simple and dont have any style, just html and js`;
    }
}

//age function
document.getElementById("mysubmit").onclick = function(){
    age = document.getElementById("demo").value;

    //check if age is int or not
    if(age =! Int){
     document.getElementById("myh1").textContent = `hello ${username} ,wellcome back mr.admin!`;
     document.getElementById("myh2").textContent = `hello ${username} welcome to our website!, is so simple and dont have any style, just html and js`;

    //feedback of submit
    if(age >= 12){
        document.getElementById("myh2").textContent = `hello ${username} welcome to our website!, is so simple and dont have any style, just html and js`;
    }
    }else{
     document.getElementById("myh1").textContent = `hello ${username}`;
     document.getElementById("myh2").textContent = `hello ${username} welcome to my page!, is so simple and dont have any style, just html and js`;
    }
}
</script>
</html>
